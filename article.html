<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعلم – المقال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط تقدم القراءة -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- ===== MASTHEAD ===== -->
  <header class="masthead">
    <div class="masthead-inner">
      <a class="logo" href="index.html">إع<span>ل</span>م</a>
      <a class="back-btn" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        العودة للرئيسية
      </a>
    </div>
  </header>

  <!-- ===== ARTICLE HERO ===== -->
  <section class="article-hero" id="articleHero">
    <img class="hero-bg" id="heroBg" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="article-cat-badge" id="catBadge"></span>
      <h1 class="article-title" id="articleTitle">جاري التحميل…</h1>
      <div class="article-meta" id="articleMeta"></div>
    </div>
  </section>

  <!-- ===== ARTICLE BODY ===== -->
  <article class="article-wrapper">
    <p class="article-lead" id="articleLead"></p>
    <div class="article-body" id="articleBody"></div>
    <div class="ornament">✦ ✦ ✦</div>
    <div class="article-footer">
      <div class="tags-row" id="articleTags"></div>
      <div class="author-card" id="authorCard"></div>
    </div>
  </article>

  <!-- ===== RELATED ===== -->
  <section class="related-section" id="relatedSection" style="display:none">
    <div class="related-inner">
      <h2 class="related-title">مقالات ذات صلة</h2>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </section>

  <footer>
    <p>© 2025 <span>إعلم</span> — منصة المعرفة العربية</p>
  </footer>

  <!-- يتضمن script.js بيانات ARTICLES المشتركة -->
  <script src="script.js"></script>
  <script>
    /* ============================================================
       منطق صفحة المقال — يعتمد على ARTICLES من script.js
       ============================================================ */

    function getCatLabel(cat) {
      return { nature: 'الطبيعة', tech: 'معلوماتية' }[cat] || cat;
    }
    function getCatClass(cat) {
      return { nature: 'cat-nature', tech: 'cat-tech' }[cat] || '';
    }
    function getAuthorInitials(name) {
      return name.split(' ').map(w => w[0]).join('').slice(0, 2);
    }

    /* شريط تقدم القراءة */
    window.addEventListener('scroll', () => {
      const doc = document.documentElement;
      const scrollTop = doc.scrollTop || document.body.scrollTop;
      const scrollHeight = doc.scrollHeight - doc.clientHeight;
      const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = pct + '%';
    });

    function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const article = ARTICLES.find(a => a.id === id) || ARTICLES[0];

      if (!article) {
        document.getElementById('articleTitle').textContent = 'المقال غير موجود';
        return;
      }

      document.title = 'إعلم – ' + article.title;

      /* Hero */
      const bg = document.getElementById('heroBg');
      bg.src = article.img;
      bg.alt = article.title;

      const badge = document.getElementById('catBadge');
      badge.textContent = getCatLabel(article.cat);
      badge.className = 'article-cat-badge ' + getCatClass(article.cat);

      document.getElementById('articleTitle').textContent = article.title;
      document.getElementById('articleMeta').innerHTML = `
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          ${article.author}
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          ${article.date}
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          ${article.readTime} للقراءة
        </span>
      `;

      /* المقتطف الرئيسي */
      document.getElementById('articleLead').textContent = article.excerpt;

      /* محتوى المقال */
      document.getElementById('articleBody').innerHTML = article.body;

      /* الوسوم */
      document.getElementById('articleTags').innerHTML =
        (article.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

      /* بطاقة المؤلف */
      document.getElementById('authorCard').innerHTML = `
        <div class="author-avatar">${getAuthorInitials(article.author)}</div>
        <div>
          <div class="author-name">${article.author}</div>
          <div class="author-label">كاتب في منصة إعلم</div>
        </div>
      `;

      /* المقالات ذات الصلة */
      const related = ARTICLES
        .filter(a => a.id !== article.id && a.cat === article.cat)
        .slice(0, 2);

      if (related.length > 0) {
        document.getElementById('relatedSection').style.display = 'block';
        document.getElementById('relatedGrid').innerHTML = related.map(r => `
          <a class="related-card" href="article.html?id=${r.id}">
            <img class="related-img" src="${r.img}" alt="${r.title}" loading="lazy">
            <div class="related-body">
              <h3 class="related-card-title">${r.title}</h3>
            </div>
          </a>
        `).join('');
      }
    }

    loadArticle();
  </script>
</body>
</html>
